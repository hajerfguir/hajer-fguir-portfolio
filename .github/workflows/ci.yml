name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.22.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: pnpm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    needs: build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.CI_CD_TOKEN }}
        run: pnpm dlx vercel@latest --prod --token "$VERCEL_TOKEN" --yes